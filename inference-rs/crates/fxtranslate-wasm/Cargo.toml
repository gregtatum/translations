[package]
name = "fxtranslate-wasm"
version = "0.4.0"
edition = "2021"
description = "WebAssembly build of the fxtranslate neural machine-translation engine — single-threaded, SIMD128 int8. Models are supplied by the host, not bundled."
license = "MPL-2.0"
# Feeds the generated npm `pkg/package.json` "repository" field so the tarball
# links back to source. wasm-pack copies this + description + license into the
# package.json it emits.
repository = "git+https://github.com/gregtatum/translations.git"
# `publish = false` is a *cargo* directive: it keeps this crate off crates.io (like
# the oracle crate, so wasm-bindgen never lands in the core `fxtranslate` graph). It
# does NOT affect wasm-pack / npm — the npm package is produced and published (by the
# user, when ready) independently of cargo.
publish = false

# wasm-pack copies a top-level README.md into the npm package if `readme` points at
# one; name it explicitly so the packaged README is the npm-consumer doc, not a
# fallback.
readme = "README.md"

[lib]
name = "fxtranslate_wasm"
path = "src/lib.rs"
# wasm-bindgen needs a cdylib to emit the `.wasm`; keep `rlib` so the crate is
# still usable/testable as a normal Rust dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, lean/pure-Rust config: no mmap, no net, no C++ toolchain, scalar
# kernel. `discovery` adds the pure record parsing / pivot routing / verify code
# (tinyjson, ruzstd, sha2 — all wasm-safe) without pulling `ureq`/`dirs`/`mmap`.
# `icu-segmenter` pins sentence segmentation to ICU4X so the npm/wasm artifact
# splits identically to the native CLI (both UAX #29) — the +~19 KB (wasm-opt'd)
# of rule-based sentence-break tables is negligible against a ~150 MB model, and
# it is the same engine family Firefox's `Intl.Segmenter` uses. This is the
# default here so `wasm-pack build` (which passes no feature flags) already
# produces the intended ICU4X-segmenting wasm build.
fxtranslate = { path = "../fxtranslate", default-features = false, features = ["lean-embed", "discovery", "icu-segmenter"] }
# The JS <-> Rust boundary: marshals `&str`/`Uint8Array`/`String` across wasm.
wasm-bindgen = "0.2"
# Lets the perf harness pass a JS phase-boundary callback (a `Function`) that the
# engine invokes at encode/decode/first-token boundaries, so the host times each
# phase with `performance.now()` (wasm has no usable `std::time::Instant`).
js-sys = "0.3"
# Routes Rust panics to `console.error` with a readable message + stack instead
# of an opaque `unreachable` trap. Installed once in the `Translator` constructor.
console_error_panic_hook = "0.1"

# wasm-only dev dep: run the discovery-parity test under a real wasm runtime
# (`wasm-pack test --node`) so the wrappers are proven live, not just compiled.
# Target-scoped so the native `cargo test -p fxtranslate-wasm` graph is unchanged.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# wasm-pack runs `wasm-opt` on the release build. `-Oz` optimizes for size (the
# real deliverable is the compressed .wasm; `-Oz` shaves ~24% off the raw module —
# see notes/12-wasm.md "Binary-size results"). This is the shipped npm profile.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
