[build-system]
# Everything this crate uses (python-source, a private `module-name` submodule,
# dynamic version, passing `pyo3/extension-module` via `[tool.maturin] features`)
# has been stable since the maturin 1.0 line. `<2.0` caps below the next semver
# major, which could break the build config.
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fxtranslate"
# Must match `abi3-py38` in Cargo.toml: that ABI target makes one wheel serve every
# CPython from this floor up, so the two move together.
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
description = "Firefox Translations neural machine-translation engine — native (compiled Rust), batteries-included model management."
readme = "README.md"
dynamic = ["version"]

[project.scripts]
# `pip install fxtranslate` installs a `fxtranslate` console script whose help/usage/
# error output is byte-identical to the Rust `fxtranslate-cli`. `python -m fxtranslate`
# runs the same `main` (see python/fxtranslate/__main__.py).
fxtranslate = "fxtranslate.cli:main"

[project.urls]
Repository = "https://github.com/gregtatum/translations"

[tool.maturin]
# The distribution and import name are both `fxtranslate`, matching the crates.io and
# npm packages. The compiled module lives at the private `fxtranslate._fxtranslate`,
# and `python/fxtranslate/__init__.py` re-exports its public surface so users can write
# `from fxtranslate import Translator`. Wrapping a compiled submodule in a Python source
# package follows maturin's guidance and leaves room for the `.pyi` stubs and the CLI
# shell without needing a second wheel.
module-name = "fxtranslate._fxtranslate"
python-source = "python"
# Turn on `pyo3/extension-module` only for the wheel build — it omits linking
# libpython, which is correct for a loadable extension but would break a plain
# `cargo build` (see the note in Cargo.toml).
features = ["pyo3/extension-module"]
