version: '3'

# Sub-Taskfile for the Rust inference engine (inference-rs), included from the root
# Taskfile under the `rs` namespace — tasks are invoked as `task rs:<task>` from
# anywhere in the repo. {{.ROOT_DIR}} is the repo root, {{.TASKFILE_DIR}} is this
# directory; paths are anchored to them so tasks work from any working directory.

vars:
  # Downloaded models, under ./data (gitignored) — shared by the C++ and Rust engines.
  MODELS_DIR: '{{.ROOT_DIR}}/data/models'

tasks:
  # A child Taskfile can't depend on a parent task, so the poetry installs the tasks
  # below need are redeclared here.
  poetry-install-utils:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - poetry install --only utils --no-root

  poetry-install-black:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - poetry install --only black --no-root

  check:
    desc: Run the inference-rs checks with concise, task-focused feedback.
    summary: |
      Runs the inference-rs checks in parallel with a compact live pass/fail summary.
      In a non-TTY run it stops at the first failure. Extend CHECKS in scripts/check.py.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/check.py

  lint-black:
    desc: Check the styling of the inference-rs Python code with Black.
    deps: [poetry-install-black]
    dir: '{{.ROOT_DIR}}'
    cmds:
      # Scoped to this directory so inference-rs checks only its own Python; Black reads
      # its config from the repo-root pyproject.toml.
      - |
        echo "poetry run black {{.TASKFILE_DIR}} --check --diff"
        if poetry run black {{.TASKFILE_DIR}} --check --diff; then
          echo "The inference-rs Python code formatting is correct.";
        else
          echo "";
          echo "Python code formatting issues detected.";
          echo "Run 'task rs:lint-black-fix' to fix them.";
          echo "";
          exit 1;
        fi

  lint-black-fix:
    desc: Fix the styling of the inference-rs Python code with Black.
    deps: [poetry-install-black]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - poetry run black {{.TASKFILE_DIR}} {{.CLI_ARGS}}

  test:
    desc: Run the workspace Rust tests (engine, oracle harness, CLI, and wasm).
    summary: |
      Runs one unified `cargo nextest` invocation across the whole workspace (engine,
      oracle harness, CLI, and wasm) in a single global parallel pool. Feature unification
      pulls in `net` via the CLI crate and `fast` is default, so `fxtranslate` is built
      exactly once and every feature-gated test still runs. A second `cargo test --doc`
      pass covers doctests, which nextest does not run. The oracle's real-trace parity
      tests skip unless a trace was recorded (task rs:translate-reference -- … --trace).
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      # nextest is a separate binary, not part of the default toolchain — fail with an
      # install hint rather than the bare `error: no such command: nextest`.
      - |
        if ! command -v cargo-nextest >/dev/null 2>&1; then
          echo "cargo-nextest is required by 'task rs:test' but was not found.";
          echo "Install it with one of:";
          echo "  cargo binstall cargo-nextest   # prebuilt, fast";
          echo "  cargo install cargo-nextest    # from source";
          exit 1;
        fi
      - cargo nextest run --workspace {{.CLI_ARGS}}
      - cargo test --workspace --doc {{.CLI_ARGS}}

  lint-rust:
    desc: Check the formatting of the inference-rs Rust code with rustfmt.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        echo "cargo fmt --check"
        if cargo fmt --check; then
          echo "The inference-rs Rust code formatting is correct.";
        else
          echo "";
          echo "Rust code formatting issues detected.";
          echo "Run 'task rs:lint-rust-fix' to fix them.";
          echo "";
          exit 1;
        fi

  lint-rust-fix:
    desc: Fix the formatting of the inference-rs Rust code with rustfmt.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo fmt {{.CLI_ARGS}}

  lint-ci:
    desc: Fail if the GitHub CI workflow drifts from the rs:check check list.
    summary: |
      Cross-checks .github/workflows/inference-rs.yml against the CHECKS list in
      scripts/check.py so `task rs:check` and CI can't silently diverge. The heavy C++
      inference-build is exempt (it stays local / taskcluster).
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/lint_ci.py

  download-model:
    desc: Download a production model from Remote Settings by language pair.
    summary: |
      Downloads the model, vocab, and lexical shortlist for a language pair from the
      Firefox production Remote Settings CDN, verifies their sha256 hashes, and writes a
      translator-cli decode config into data/models/{src}{trg}/.

      Example:
        task rs:download-model -- en es
    deps: [poetry-install-utils]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - >-
        PYTHONPATH=$(pwd) poetry run python -W ignore
        {{.TASKFILE_DIR}}/scripts/download_model.py
        --models-dir {{.MODELS_DIR}}
        {{.CLI_ARGS}}

  translate:
    desc: Translate text with the Rust inference-rs engine (greedy, int8shiftAlphaAll).
    summary: |
      Runs the Rust engine on a downloaded model (task rs:download-model -- <src> <trg>).
      Text is passed with --text or piped over stdin (translated line by line). The
      lexical shortlist is off by default (it lowers quality on short inputs); --shortlist
      enables it.

      Examples:
        task rs:translate -- en es --text "Hello world!"
        task rs:translate -- en es --shortlist --text "Hello world!"
        echo "Hello world!" | task rs:translate -- en es
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/translate.py {{.CLI_ARGS}}

  perf:
    desc: Measure engine perf (TTFT + tok/s), or record a samply Firefox profile.
    summary: |
      Translates a corpus N times (single-threaded, build excluded from timing) and
      reports the median and IQR of time-to-first-token (TTFT) and steady-state
      tokens/second. Compare build variants with --features. Pass --samply to record a
      Firefox Profiler .json.gz under artifacts/ instead of timing (needs `samply` on PATH).

      Requires the model downloaded (task rs:download-model -- <src> <trg>).

      Examples:
        task rs:perf -- en fr
        task rs:perf -- en fr --features lean-embed
        task rs:perf -- en fr --samply
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/perf.py {{.CLI_ARGS}}

  release:
    desc: Release build + binary-size characterization + validation.
    summary: |
      Builds the release artifacts and reports their size (optionally a `cargo bloat`
      breakdown). Unless --skip-validation, it checks the release binary is lean
      (instrumentation/dhat off) and produces the same output as the debug build, and
      reports the translator-cli parity rate. Validation needs the model downloaded and,
      for the parity number, the C++ oracle built.

      Examples:
        task rs:release
        task rs:release -- --pair en ru
        task rs:release -- --bloat
        task rs:release -- --skip-validation
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/release_build.py {{.CLI_ARGS}}

  publish:
    desc: Publish the fxtranslate ecosystem — crates.io + npm + PyPI — in lockstep, then tag.
    summary: |
      A resumable release orchestrator. Bumps both publishable crates AND
      npm/package.json in lockstep on one shared version (the PyPI package reads its
      version from its crate Cargo.toml, so it moves for free), builds + tests, publishes
      the engine then the CLI to crates.io (that order — the CLI pins the engine exactly),
      publishes the npm package (whose prepublishOnly rebuilds the wasm core + runs
      parity), handles the PyPI leg (builds the sdist + local wheel; uploads with
      --pypi-upload), and creates + pushes the fxtranslate-vX.Y.Z tag last, once every
      registry is up — so the tag never marks a half-published release.

      It runs as a two-pass status board like `task rs:check`: it first probes the
      registries + git (read-only) to render what's done vs pending, then executes the
      pending steps in order with stdout hidden, dumping the full log + a per-step healing
      hint only on failure. Status is derived from the world, never stored, so re-runs are
      self-healing: fix the one red row and re-run to resume (a bare run resumes the
      manifest version; a bump level is refused mid-release, guarding a double-bump).
      Already-published crates/npm/PyPI versions are skipped. Use --status for the
      probe-only board, --dry-run to preview (renders the board, runs only the reversible
      validate steps), and --watch-wheels to poll the CI-built wheel matrix to 4/4.

      Needs `cargo login`, `npm login`, maturin + twine, a clean tree, and should be on
      main. See inference-rs/RELEASING.md for the full checklist.

      Examples:
        task rs:publish -- --status          # probe-only board: what's done vs pending
        task rs:publish -- patch --dry-run   # preview; changes nothing
        task rs:publish -- patch             # release for real (or: minor / major / --set X.Y.Z)
        task rs:publish                       # resume an in-flight release (no bump)
    dir: '{{.TASKFILE_DIR}}'
    # Wire stdin through to the terminal: the npm publish step prompts for a 2FA
    # one-time password when the account requires it, and without this Task leaves
    # the command's stdin disconnected, so the prompt can never reach the operator.
    interactive: true
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/publish.py {{.CLI_ARGS}}

  fxtranslate:
    desc: Run the batteries-included fxtranslate CLI (discover/download/cache + translate).
    summary: |
      Builds and runs the fxtranslate binary. It discovers models from Remote Settings,
      downloads+caches them under the platform-specific {cache}/fxtranslate directory,
      and translates. Examples:
        task rs:fxtranslate -- list en
        echo "Hello world." | task rs:fxtranslate -- translate en es
        task rs:fxtranslate -- translate en es "Hello world."
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo run --quiet --release -p fxtranslate-cli -- {{.CLI_ARGS}}

  build-cli:
    internal: true
    desc: Build the Rust fxtranslate CLI (debug) — the conformance oracle binary.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      # Build into a dedicated target dir (target/conformance) instead of the shared
      # target/. This is a dev-profile build, whereas rs:test runs `cargo nextest`
      # in the test profile; sharing target/ made the two invalidate and recompile
      # each other's fxtranslate/fxtranslate-cli artifacts every time rs:check
      # alternated between them (~6-12s of thrash). Isolating this build keeps
      # nextest fully warm across runs. scripts/conformance.py's RUST_BIN points at
      # this same target/conformance/debug/ path.
      - cargo build -p fxtranslate-cli --target-dir target/conformance

  build-wasm:
    internal: true
    desc: Build the shared wasm core into npm/wasm/ (needs wasm-pack + the wasm32 target).
    dir: '{{.TASKFILE_DIR}}/npm'
    cmds:
      - npm run build:wasm

  build-py-conformance:
    internal: true
    desc: Build the fxtranslate Python binding into a local .venv so conformance can drive it.
    summary: |
      Provisions the interpreter the conformance harness drives the python binding under.
      Creates a project-local `.venv` (gitignored; maturin auto-discovers a `.venv` in the
      current-or-parent dir, so no activation is needed) and installs the native
      fxtranslate extension into it with `maturin develop`. The conformance task then runs
      `scripts/conformance.py` with `.venv/bin/python3`, so the harness's
      `find_spec("fxtranslate")` probe resolves the module just built and the python
      binding is exercised — locally exactly as in CI, never SKIPped.

      maturin is REQUIRED (like rs:build-py / rs:test-py): without it this fails with an
      install hint rather than silently dropping python coverage.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        if ! command -v maturin >/dev/null 2>&1; then
          echo "maturin is required by 'task rs:conformance' but was not found.";
          echo "Install it with one of:";
          echo "  pipx install maturin       # isolated, recommended";
          echo "  pip install maturin        # into the active environment";
          exit 1;
        fi
      # The binding has no python runtime deps (see pyproject), so a bare `python3 -m venv`
      # is enough — no network, no pip installs. Reused across runs; `maturin develop`
      # rebuilds the extension every run, so the venv never holds a stale build.
      - '[ -d .venv ] || python3 -m venv .venv'
      - maturin develop -m crates/fxtranslate-py/Cargo.toml

  build-py:
    desc: Build the fxtranslate Python wheel (native PyO3 extension) with maturin.
    summary: |
      Builds the fxtranslate-py crate into a Python wheel with maturin. The engine is
      native compiled Rust (gemmology SIMD, mmap, built-in networked model management)
      — the fast, batteries-included face of the engine, unlike the wasm npm build.
      Pass `-- develop` for an editable install into the active venv instead of a
      wheel; any extra args flow through to maturin.

      Examples:
        task rs:build-py                 # build a wheel into target/wheels/
        task rs:build-py -- develop      # editable install into the active venv
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      # maturin is a separate tool, not confirmed installed — fail with an install
      # hint rather than the bare `command not found`.
      - |
        if ! command -v maturin >/dev/null 2>&1; then
          echo "maturin is required by 'task rs:build-py' but was not found.";
          echo "Install it with one of:";
          echo "  pipx install maturin       # isolated, recommended";
          echo "  pip install maturin        # into the active environment";
          exit 1;
        fi
      - |
        if [ "{{.CLI_ARGS}}" = "develop" ]; then
          maturin develop -m crates/fxtranslate-py/Cargo.toml;
        else
          maturin build -m crates/fxtranslate-py/Cargo.toml {{.CLI_ARGS}};
        fi

  test-py:
    desc: Run the hermetic pytest suite for the fxtranslate Python binding.
    summary: |
      Installs the fxtranslate wheel into the active environment with `maturin develop`
      and runs the offline pytest suite (crates/fxtranslate-py/tests) — binding-loads,
      backend(), discovery over the recorded Remote Settings fixture, and error mapping.
      No network, no real model. Deps on build-cli so the Rust oracle binary exists when
      the opt-in translate-parity test is enabled (FXTRANSLATE_MODEL_DIR set).
    dir: '{{.TASKFILE_DIR}}'
    deps: [build-cli]
    cmds:
      - |
        if ! command -v maturin >/dev/null 2>&1; then
          echo "maturin is required by 'task rs:test-py' but was not found.";
          echo "Install it with one of:";
          echo "  pipx install maturin       # isolated, recommended";
          echo "  pip install maturin        # into the active environment";
          exit 1;
        fi
      - maturin develop -m crates/fxtranslate-py/Cargo.toml
      - python3 -m pytest crates/fxtranslate-py/tests {{.CLI_ARGS}}

  conformance:
    desc: Pass A of the CLI conformance harness — interface parity, byte-exact, hermetic.
    summary: |
      Runs every registered fxtranslate CLI (the Rust reference, the npm binding, and
      the native Python binding) against committed goldens and asserts byte-identical
      stdout/stderr/exit for help, errors, `list`, and `models list/info/rm`. Hermetic:
      a loopback records server + throwaway cache dirs, no network, no model downloads —
      so it is fast and lives in the default `task rs:check`. Deps build the CLIs it
      drives: the Rust binary, the npm wasm core (npm/wasm/), and the Python binding into
      a local .venv (build-py-conformance). The harness runs under .venv/bin/python3, so
      the python binding is always exercised — no venv juggling, and maturin is required.
      The Rust binary builds into a dedicated target dir (target/conformance) so its
      dev-profile build doesn't thrash rs:test's test-profile cache in the shared
      target/ — see build-cli.

      Run just one binding with, e.g., `task rs:conformance -- --only python`.

      Regenerate goldens from the oracle with:
        scripts/conformance.py --update-goldens
    deps: [build-cli, build-wasm, build-py-conformance]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.TASKFILE_DIR}}/.venv/bin/python3 {{.TASKFILE_DIR}}/scripts/conformance.py {{.CLI_ARGS}}'

  conformance-corpus:
    desc: Pass B of the CLI conformance harness — corpus translation parity, tolerant.
    summary: |
      Feeds a corpus through each CLI's `translate` and reports the line-by-line
      exact-match rate against a committed Rust golden, passing when it clears a
      documented tolerance floor (npm-wasm diverges on a few <=1-ULP libm argmax
      flips; the int8 GEMM stays bit-identical). Divergences are printed so they can
      be eyeballed as benign word-choice flips.

      NOT in the fast `task rs:check` / CI: it needs the real models (~150MB/pair,
      downloaded on first use into the fxtranslate cache) and is slow — like
      rs:parity. Build the CLIs it drives (rs:conformance builds them; or run
      `cargo build -p fxtranslate-cli` and `task rs:build-wasm` first).

      Examples:
        task rs:conformance-corpus                 # every CLI vs the 200-line golden
        task rs:conformance-corpus -- --limit 30   # quick slice
        task rs:conformance-corpus -- --only npm   # just the npm binding
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/conformance_translate.py {{.CLI_ARGS}}

  capture-bergamot-goldens:
    desc: Capture plain-text translation goldens from the REAL Bergamot WASM engine.
    summary: |
      Freezes "what Bergamot does today" as a diffable artifact so the native engine
      can be gated against it (plan 03 §2/§3b, gate M1.3). Runs the actual shipping
      Bergamot engine (Marian compiled to wasm, the same bergamot-translator.js
      vendored into Firefox) through the committed legacy Node harness under
      inference/wasm/tests, feeding the SAME NLLB en->fr source corpus that Pass B
      uses (corpora/nllb-en-fr.txt) as plain text (html:false). Writes
      artifacts/goldens/bergamot/plain/<src>-<trg>.jsonl ({src,tgt} per line) plus a
      MODELS.lock of the model sha256s the goldens were captured against.

      Requires a one-time build of the Bergamot wasm engine and the model dirs
      symlinked into inference/wasm/tests/models/ (the script prints how). The engine
      build needs emscripten 3.1.8 and CMAKE_POLICY_VERSION_MINIMUM=3.5 (modern cmake
      dropped compat with the vendored Eigen), the same env this Taskfile already uses
      for build-spm-encode.

      Examples:
        task rs:capture-bergamot-goldens                 # en->fr, 200 lines
        task rs:capture-bergamot-goldens -- --lines 50   # quick slice
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/capture_bergamot_goldens.py {{.CLI_ARGS}}

  make-blocks:
    desc: Group the NLLB corpus into paragraph-sized blocks for the block benchmark.
    summary: |
      Groups the committed one-sentence-per-line NLLB corpus into paragraph-sized blocks
      (grouping only, no sentence splitting) for the block benchmark. Deterministic.

      Example:
        task rs:make-blocks
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/make_blocks.py {{.CLI_ARGS}}

  build-spm-encode:
    desc: Build the upstream spm_encode binary from the vendored sentencepiece.
    summary: |
      Builds the reference tokenizer used to generate tokenizer goldens (task
      rs:spm-goldens). marian builds only the sentencepiece static lib, so this does a
      standalone build with the CLI tools enabled, producing inference/build-spm/src/spm_encode.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - cmake -S inference/marian-fork/src/3rd_party/sentencepiece -B inference/build-spm
          -DCMAKE_BUILD_TYPE=Release -DSPM_ENABLE_SHARED=OFF -DSPM_BUILD_LIBRARY_ONLY=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - cmake --build inference/build-spm --target spm_encode -j4

  spm-goldens:
    desc: Regenerate committed tokenizer goldens (corpora/*.ids) with spm_encode.
    summary: |
      Re-tokenizes each committed corpus with the reference spm_encode + the en-fr vocab
      and writes the golden ids the tokenizer oracle (tests/spm_oracle.rs) checks against.
      Run after changing a corpus. Requires task rs:build-spm-encode and the
      downloaded vocab.
    dir: '{{.TASKFILE_DIR}}'
    vars:
      SPM: '{{.ROOT_DIR}}/inference/build-spm/src/spm_encode'
      VOCAB: '{{.MODELS_DIR}}/enfr/vocab.enfr.spm'
      ENJA_SRC: '{{.MODELS_DIR}}/enja/srcvocab.enja.spm'
      ENJA_TRG: '{{.MODELS_DIR}}/enja/trgvocab.enja.spm'
    cmds:
      - '{{.SPM}} --model={{.VOCAB}} --output_format=id < corpora/dev-en.txt > corpora/dev-en.ids'
      - '{{.SPM}} --model={{.VOCAB}} --output_format=id < corpora/nllb-en-fr.txt > corpora/nllb-en-fr.ids'
      # Split-vocab (CJK) goldens: English through the source vocab, Japanese through the target vocab.
      - '{{.SPM}} --model={{.ENJA_SRC}} --output_format=id < corpora/dev-en.txt > corpora/dev-en.enja-src.ids'
      - '{{.SPM}} --model={{.ENJA_TRG}} --output_format=id < corpora/dev-ja.txt > corpora/dev-ja.enja-trg.ids'

  sample-corpus:
    desc: Sample a diverse source corpus from NLLB/CCMatrix and cache a seeded subset.
    summary: |
      Streams the CCMatrix bitext (the mined data behind NLLB) for a pair, caps the
      download at ~500 MB, samples a seeded subset of source sentences, and writes it
      under corpora/ with a sha256. The full multi-GB file is never committed.

      Example:
        task rs:sample-corpus -- en fr
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/sample_corpus.py {{.CLI_ARGS}}

  parity:
    desc: Report greedy exact-match rate of inference-rs vs translator-cli over a corpus.
    summary: |
      Feeds a corpus (one pre-split sentence per line) through both engines and reports
      the greedy exact-match rate plus the mismatches. Shortlist off by default (the
      production baseline); pass --shortlist to enable it on both sides.

      Requires the model downloaded (task rs:download-model -- <src> <trg>) and
      the reference engine built (task inference-build).

      Examples:
        task rs:parity -- en fr
        task rs:parity -- en es --limit 10
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/parity.py {{.CLI_ARGS}}

  translate-reference:
    desc: Translate text with the reference C++ translator-cli (to validate the Rust engine against).
    summary: |
      Runs the existing C++ inference engine so the Rust implementation can be validated
      against a known-good reference. Requires the engine to be built natively
      (`task inference-build`) and the model to be downloaded
      (`task rs:download-model -- <src> <trg>`).

      Arguments are passed through to the script (see --help):
        task rs:translate-reference -- --help

      Examples:
        task rs:translate-reference -- en es --text "Hello World"
    dir: '{{.ROOT_DIR}}'
    cmds:
      # Runs from the repo root so the script's relative model/binary defaults resolve.
      - >-
        poetry run python -W ignore
        {{.TASKFILE_DIR}}/scripts/translate_reference.py
        {{.CLI_ARGS}}

  # ONNX export evaluation (route B of notes/15-onnx-port.md). A clean-room Python
  # converter rebuilds the en-fr student as ONNX graphs, validates them against a
  # numpy float golden and the inference-rs engine, and quantizes to int8. Lives in
  # onnx/; heavier deps (onnxruntime) go in the project-local .venv, not poetry.

  onnx-venv:
    internal: true
    desc: Provision the .venv with the ONNX evaluation's Python dependencies.
    summary: |
      Ensures the project-local .venv (the same one rs:conformance uses) exists and has
      the onnx/requirements.txt deps — onnx, onnxruntime, sentencepiece, sacrebleu —
      installed. They are kept out of the repo poetry env because onnxruntime is heavy
      and only this evaluation needs it. Idempotent: the pip install is skipped once the
      deps import. Every rs:onnx-* python task depends on this, so the flow runs
      hermetically under .venv/bin/python3, mirroring rs:conformance.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '[ -d .venv ] || python3 -m venv .venv'
      - |
        if ! .venv/bin/python3 -c "import onnx, onnxruntime, sentencepiece, sacrebleu" 2>/dev/null; then
          .venv/bin/python3 -m pip install --disable-pip-version-check -r onnx/requirements.txt
        fi

  onnx-download-model:
    desc: Resolve + download the production en-ru float student .npz + vocab (from GCS).
    summary: |
      Resolves the float student model behind a *production* Firefox model and downloads it
      into data/models/onnx/en-ru/, where onnx/model_npz.py looks. Rather than guess a
      training run, it matches hashes: the Remote Settings model record's decompressedHash
      (sha256 of the shipped intgemm bin) against each GCS run's exported/metadata.json — so
      the float .npz is provably the one behind the shipped model. It also writes a
      resolved.json with the marian modelConfig (dims/depths) the converter reads.

      Pinned to RS version 3.0 (the en-ru `base` architecture) so the comparison lines up
      with the existing rs/marian headline numbers (notes/09); the current production en-ru
      is base-memory (v3.1) — drop --version to target it. See notes/16. Runs under poetry
      so the shared RS + download helpers are importable.
    deps: [poetry-install-utils]
    dir: '{{.ROOT_DIR}}'
    # No {{.CLI_ARGS}}: the pair/version are pinned here, and CLI_ARGS is global to the
    # `task` invocation — so forwarding it would leak a parent task's args (e.g. the text
    # from rs:onnx-translate) into this download when it runs as a dependency.
    cmds:
      - >-
        PYTHONPATH=$(pwd) poetry run python -W ignore
        {{.TASKFILE_DIR}}/scripts/download_onnx_model.py
        en ru --version 3.0
        --models-dir {{.MODELS_DIR}}

  onnx-export:
    desc: Build the float32 ONNX encoder + decode-step graphs from the student .npz.
    summary: |
      Rebuilds onnx/models/encoder.onnx and decode_step.onnx from the resolved production
      float .npz (data/models/onnx/en-ru/, fetched by rs:onnx-download-model), with all dims
      read from its resolved.json modelConfig. These float graphs are the dev scaffold
      validated by rs:onnx-validate; rs:onnx-quantize
      turns them into the shipped int8 artifact. Run this first — the other onnx tasks read
      the graphs it writes.
    deps: [onnx-venv, onnx-download-model]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - .venv/bin/python3 onnx/export_encoder.py
      - .venv/bin/python3 onnx/export_decoder.py

  onnx-quantize:
    desc: Dynamic-int8 quantize the float ONNX graphs (→ onnx/models/*.int8.onnx).
    summary: |
      Runs onnxruntime.quantization.quantize_dynamic over the float graphs to produce the
      int8 versions and prints the size table. Needs rs:onnx-export to have run first.
    deps: [onnx-venv]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - .venv/bin/python3 onnx/quantize.py

  onnx-translate:
    desc: Translate text through the exported ONNX graphs (float, or --int8).
    summary: |
      Drives the encoder-once + greedy decode-loop engine over onnxruntime. Text is passed
      as a positional argument or piped over stdin (translated line by line); --int8
      selects the quantized graphs. Needs rs:onnx-export (and rs:onnx-quantize for --int8).

      Examples:
        task rs:onnx-translate -- "Hello, world."
        task rs:onnx-translate -- --int8 "Hello, world."
        echo "Hello world." | task rs:onnx-translate
    deps: [onnx-venv, onnx-download-model]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - .venv/bin/python3 onnx/engine.py {{.CLI_ARGS}}

  onnx-dump:
    desc: Dump inference-rs reference tensors for the ONNX cross-check (→ onnx/testdata/).
    summary: |
      Runs the int8 inference-rs engine (via the fxtranslate-oracle `dump` subcommand) on a
      sentence and writes the encoder context + first-step logits + metadata into
      onnx/testdata/. These are the reference tensors rs:onnx-validate's Gate 1 checks the
      numpy golden against — the engine is ground truth, as everywhere else in inference-rs.
      Uses the en-ru `base` int8 model with its shared vocab — the same base v3.0 the ONNX
      graphs are built from, so the int8 reference and the float graphs pair up. Builds the
      oracle in release on demand.

      The int8 bin must be the base (v3.0) intgemm model at data/models/enru/ (get it with
      `task rs:download-model -- en ru`, which currently resolves the newer base-memory
      v3.1 — see notes/16; a matching-version fetch is a follow-up).

      Examples:
        task rs:onnx-dump
        task rs:onnx-dump -- "The quick brown fox."
    deps: [onnx-download-model]
    dir: '{{.TASKFILE_DIR}}'
    vars:
      MODEL: '{{.MODELS_DIR}}/enru/model.enru.intgemm.alphas.bin'
      SRC_SPM: '{{.MODELS_DIR}}/onnx/en-ru/vocab.spm'
      TRG_SPM: '{{.MODELS_DIR}}/onnx/en-ru/vocab.spm'
      TEXT: '{{.CLI_ARGS | default "Hello, world. This is a test of the translation engine."}}'
    cmds:
      - cargo run --quiet --release -p fxtranslate-oracle -- dump {{.MODEL}} {{.SRC_SPM}} {{.TRG_SPM}} "{{.TEXT}}"

  onnx-validate:
    desc: Validate the ONNX graphs — numeric gate vs numpy + cross-check vs inference-rs.
    summary: |
      Runs both feasibility gates from notes/15. Gate 2 (validate_onnx.py): every ONNX
      tensor vs the numpy float golden within 1e-4, plus end-to-end string match. Gate 1
      (validate_numpy.py): the numpy golden vs the inference-rs int8 reference tensors
      (argmax must agree; ~1% tensor diff is expected int8 noise). Needs rs:onnx-export;
      Gate 1 also needs rs:onnx-dump to have written onnx/testdata/ (it is skipped with a
      hint if those are missing).
    deps: [onnx-venv, onnx-download-model]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - .venv/bin/python3 onnx/validate_onnx.py
      - .venv/bin/python3 onnx/validate_numpy.py

  onnx-perf:
    desc: Apples-to-apples block perf — ONNX vs inference-rs vs marian vs Firefox.
    summary: |
      Runs scripts/final_comparison.py with the ONNX engine added as a fourth subject:
      the same Frankenstein block corpus and the same en-ru base model through inference-rs
      (rust), marian block-bench (native), and the ONNX engine (onnx/blockbench.py under
      .venv), plus the pasted Firefox Wasm perftest numbers. Reports words/s, tokens/s,
      translate s, init ms, and settled/peak RSS per engine, model load excluded, ORT pinned
      single-threaded. --onnx-precision float benchmarks the float graphs instead of int8.

      Prerequisites (the script errors with a hint if any are missing):
        - ONNX graphs built: task rs:onnx-quantize (int8) — chains export + download-model
        - block-bench built: task inference-build
        - en-ru base v3.0 intgemm model: task rs:download-model -- en ru --version 3.0

      ONNX threading is a toggle: --onnx-threads 1 (default) is single-threaded and comparable
      to the native rows; --onnx-threads 0 uses ORT's default multithreaded pool (faster decode,
      more memory — inference-rs is single-threaded and memory-optimized by design).

      Examples:
        task rs:onnx-perf
        task rs:onnx-perf -- --onnx-threads 0        # ORT multithreaded
        task rs:onnx-perf -- --onnx-precision float
        task rs:onnx-perf -- --runs 6
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/final_comparison.py --onnx {{.CLI_ARGS}}

  kernel-micro:
    desc: Microbench the gemmology int8 GEMM kernel at the decoder/encoder shapes.
    summary: |
      Times PreparedB::matmul_into (int matmul + dequant + bias) at the exact shapes the engine
      runs — m=1..4 decoder, m=64/256 encoder, k=512, n up to 32000 — and prints GFLOP/s. Pairs
      with rs:onnx-kernel-micro (ORT MatMulInteger) to isolate the kernel from the graph. See
      notes/17.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo run --quiet --release --example kernel_micro --features fast -p fxtranslate

  onnx-kernel-micro:
    desc: Microbench ORT MatMulInteger (MLAS) at the same shapes as rs:kernel-micro.
    summary: |
      Single-threaded ORT MatMulInteger GFLOP/s at the decoder/encoder shapes, the MLAS side of
      the kernel comparison in notes/17. Caveat: includes per-run dispatch + int32 output
      marshalling, so small-m numbers are a loose lower bound, not a clean kernel figure.
    deps: [onnx-venv]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - .venv/bin/python3 onnx/kernel_micro.py

  onnx-quality:
    desc: Quality + rough perf of the ONNX engines vs inference-rs over a corpus.
    summary: |
      Translates ~50 varied English sentences through float ONNX, int8 ONNX, and the
      inference-rs int8 engine, and reports chrF / exact-match / token-overlap for each
      engine pair (float ONNX is the anchor) plus indicative per-sentence wall-clock. Needs
      rs:onnx-export + rs:onnx-quantize, and the oracle binary
      (cargo build --release -p fxtranslate-oracle).
    deps: [onnx-venv, onnx-download-model]
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - .venv/bin/python3 onnx/quality.py
